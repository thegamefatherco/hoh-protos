syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/timestamp.proto";
import "init.proto";
import "reward.proto";

message GrowthFundDTO {
  int64 entity_id = 1;
  string growth_fund_definition_id = 2;
}

message GrowthFundDefinitionDTO {
  string id = 1;
}

message GrowthFundCheckpointDefinitionDTO {
  string id = 1;
  ActionComponentDTO collect = 2;
}

message CollectGrowthFundCheckpointRequest {
  int64 growth_fund_entity_id = 1;
  string checkpoint_definition_id = 2;
  google.protobuf.Timestamp action_at = 3;
}

message GrowthFundRequirementDTO {
  string growth_fund_definition_id = 1;
}

message GrowthFundRewardDTO {
  BaseRewardDTO base_data = 1;
  string growth_fund_definition_id = 2;
}
