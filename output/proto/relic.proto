syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "hero_battle.proto";
import "hero_shared.proto";
import "init.proto";
import "resource.proto";
import "reward.proto";

message RelicUpgradeRequest {
  int64 relic_id = 2;
  PartialPaymentDTO invested_premium = 3;
}

message RelicUnequipRequest {
  int64 relic_id = 2;
  PartialPaymentDTO invested_premium = 3;
}

message RelicEquipRequest {
  PartialPaymentDTO invested_premium = 1;
  int64 relic_id = 2;
  string hero_definition_id = 3;
}

message RelicPush {
}

message RelicDTO {
  int64 id = 1;
  string definition_id = 2;
  int32 level = 3;
  int32 ascension_level = 4;
  string equipped_on_hero_definition_id = 5;
  bool is_new = 6;
}

message RelicDefinitionDTO {
  message RelicLevelDataDTO {
    bool ascension = 1;
    int32 level = 2;
    int32 ascension_level = 3;
    string relic_cost_definition_id = 4;
  }
  message RelicStatBoostDTO {
    UnitStatBoostDTO boost = 1;
    string relic_boost_age_modifier_definition_id = 2;
  }
  string definition_id = 1;
  string relic_rarity_definition_id = 2;
  HeroTaskFilterDTO hero_equip_filter = 3;
}

message RelicBoostAgeModifierDefinitionDTO {
  string definition_id = 1;
  float modifier_by_age_definition_id = 2;
  float fallback = 3;
}

message RelicUnitDataDTO {
  string relic_definition_id = 1;
  int32 level = 2;
  int32 ascension_level = 3;
  string age_definition_id = 4;
}

message RelicCostDefinitionDTO {
  string definition_id = 1;
  ActionComponentDTO unequip_cost = 2;
  ActionComponentDTO upgrade_cost = 3;
}

message RelicRewardDTO {
  BaseRewardDTO base_data = 1;
  string relic_definition_id = 2;
}

message RelicRarityDefinitionDTO {
  string definition_id = 1;
}

message RelicMarkAsSeenRequest {
}

message RelicLevelFormulaTermDTO {
  double fallback = 1;
}

message RelicRarityFormulaTermDTO {
  double factors_by_relic_rarity = 1;
  double fallback = 2;
}
