syntax = "proto3";

package InnoGames.Generated.Protobuf;

enum DeviceType {
  DeviceType_ANDROID = 0;
  DeviceType_APPLE = 1;
  DeviceType_APPLE_DEV = 2;
}

message PushNotificationRegistrationRequest {
  string client_id = 1;
  string client_token = 2;
  DeviceType device_type = 3;
  string device_name = 4;
  string user_agent = 5;
}
