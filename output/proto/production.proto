syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "init.proto";
import "production_type.proto";
import "resource.proto";
import "worker.proto";

enum ProductionSourceConstant {
  ProductionSourceConstant_BUILDING = 0;
  ProductionSourceConstant_CUSTOMIZATION = 1;
}

enum ProductionCollectType {
  ProductionCollectType_ALL = 0;
  ProductionCollectType_BUILDING = 1;
  ProductionCollectType_CUSTOMIZATION = 2;
}

message ProductionDTO {
  int64 id = 1;
  string definition_id = 2;
  google.protobuf.Timestamp started_at = 3;
  ProductionType production_type = 4;
  int32 slot = 6;
  bool is_complete = 7;
  bool is_started = 8;
  int32 amount = 10;
  ProductionSourceConstant source = 13;
  int32 duration = 14;
}

message ProductionComponentDTO {
  string id = 1;
  ProductionType type = 2;
  bool auto = 3;
  google.protobuf.Duration produced_resources = 4;
  google.protobuf.Duration duration = 5;
  google.protobuf.Duration min_collection_period = 6;
  bool early_collectable = 7;
  double skip_price_per_minute = 8;
  ActionComponentDTO behaviours = 9;
  ActionComponentDTO start = 10;
  ActionComponentDTO finish = 11;
  int32 production_index = 12;
  string subscription_benefit_definition_id = 13;
  google.protobuf.Duration subscription_duration = 14;
}

message AvailableWorkersRequirementDTO {
  int32 num_workers = 1;
}

message HappinessBoostDTO {
  string resource_id = 1;
  int64 available = 2;
  int64 projected = 3;
}

message TimeBoostDTO {
  int64 available = 1;
  int64 projected = 2;
}

message CultureBehaviourDTO {
  int32 points = 1;
}

message WorkerBehaviourDTO {
  int32 amount = 1;
  WorkerType type = 2;
}

message ProductionQueueMultipleRequest {
  int64 queued_productions = 2;
  int64 total_invested_premium = 3;
}

message ProductionQueueRequest {
  google.protobuf.Any location = 1;
  string definition_id = 2;
  PartialPaymentDTO reserved_worker_ids = 4;
  PartialPaymentDTO invested_premium = 5;
}

message ProductionCancelRequest {
  google.protobuf.Any location = 1;
  int32 slot = 2;
}

message ProductionSkipRequest {
  google.protobuf.Any location = 1;
  int32 slot = 2;
  bool cancel_queued = 3;
}

message ProductionCollectRequest {
  ProductionCollectType locations = 1;
  ProductionCollectType type = 3;
}

message ProductionCollectWorkerRequest {
  google.protobuf.Any location = 1;
  int32 slot = 2;
}

message NotProductionBoostedTraitDTO {
}

message ProducingEntitiesDTO {
}
