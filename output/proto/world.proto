syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/timestamp.proto";

message WorldInfoDTO {
  int32 id = 1;
  bool recommended = 2;
  WorldAccountInfoDTO account_info = 3;
}

message WorldAccountInfoDTO {
  google.protobuf.Timestamp last_login = 1;
  string display_name = 2;
  string age = 3;
}

message GetWorldsResponse {
  int32 worlds = 1;
  int32 current_world_id = 2;
}

message ExtensionRegistry {
}
