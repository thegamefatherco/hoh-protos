syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "init.proto";

message BattleEventBattleLocationDTO {
  int64 event_id = 1;
  string component = 2;
  int32 battle_index = 3;
}

message BattleEventBattleInstantPlayRequest {
  BattleEventBattleLocationDTO location = 1;
  int32 amount = 2;
}

message BattleEventBattleVODTO {
  string battle_definition_id = 1;
  ActionComponentDTO play_start = 2;
  ActionComponentDTO instant_play_start = 3;
  ActionComponentDTO play_finish = 4;
  ActionComponentDTO unlock_finish = 5;
}

message BattleEventBattleComponentDTO {
  string id = 1;
  int32 battles = 2;
  int32 stars_required_for_instant_play = 3;
}

message BattleEventBattleStateDTO {
}

message FinishEventBattleTaskDTO {
  string id = 1;
  int64 amount = 2;
  string component_definition_id = 3;
  int32 battle_definition_ids = 4;
  int32 min_index = 5;
  int32 max_index = 6;
}
