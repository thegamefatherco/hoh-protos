syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "init.proto";

message EventTaskComponentDTO {
  string definition_id = 1;
  google.protobuf.Any task = 2;
  bool progress_carried_over = 3;
  ActionComponentDTO reward = 4;
  int32 daily_reward_cap = 5;
}

message EventTaskStateDTO {
  int32 progress = 1;
  int32 daily_reward_grants = 2;
  google.protobuf.Timestamp next_reset_at = 3;
}
