syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/timestamp.proto";
import "resource.proto";

message DailyBonusCollectRequest {
  int64 daily_bonus_entity_id = 1;
}

message DailyBonusPurchaseProgressRequest {
  int64 daily_bonus_entity_id = 1;
  PartialPaymentDTO buy_missing_resources = 2;
}

message DailyBonusDefinitionDTO {
  string definition_id = 1;
  int32 rewards = 3;
  int32 purchase_progress_cost = 4;
  int32 reset_time_in_seconds = 5;
  int32 shop_pages = 10;
  int32 shop_order = 11;
}

message DailyBonusPush {
}

message DailyBonusDTO {
  int64 entity_id = 1;
  DailyBonusDefinitionDTO definition = 2;
  int32 collected = 3;
  google.protobuf.Timestamp last_collect = 4;
  int32 completed = 5;
}

message EventDailyBonusModuleDTO {
  DailyBonusDefinitionDTO definition = 1;
  google.protobuf.Timestamp start_at = 2;
  google.protobuf.Timestamp end_at = 3;
}
