syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "resource.proto";

message BazaarDefinitionDTO {
  string id = 1;
  float skip_offer_cooldown_premium_cost_per_minute = 2;
  int32 minimum_amount_per_good = 3;
  int32 initial_offer_amount = 4;
  int32 maximum_available_premium_slots = 5;
}

message BazaarPremiumSlotDefinitionDTO {
  string id = 1;
  int32 order = 2;
}

message BuyOfferRequest {
  int64 pool_task_id = 1;
  PartialPaymentDTO partial_payment = 2;
}

message GenerateOffersRequest {
  bool is_premium = 1;
  int64 invested_premium = 2;
  int64 event_id = 3;
  string component_definition_id = 4;
}

message UnlockPremiumSlotRequest {
  int64 event_id = 1;
  string component_definition_id = 2;
}

message BazaarLevelRequirementDTO {
  string bazaar_definition_id = 1;
  int32 min_level = 2;
  int32 max_level = 3;
}

message BazaarPlayerStateDTO {
  int32 level = 1;
  int32 unlocked_slots = 2;
  int32 premium_slots = 3;
  google.protobuf.Timestamp last_trigger = 4;
  google.protobuf.Duration cooldown = 5;
}

message BazaarAcceptOfferTaskDTO {
  string id = 1;
  int64 amount = 2;
  string resource = 3;
}
