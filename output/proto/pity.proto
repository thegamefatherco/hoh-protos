syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "rarity.proto";

message PitiesDTO {
}

message PityDTO {
  string definition_id = 1;
  int32 pool_fill = 2;
}

message PityDefinitionDTO {
  string id = 1;
  int32 poolsize = 2;
  Rarity minimum_rarity = 3;
}

message PityComponentDTO {
  string id = 1;
  string pity_definition_id = 2;
  int32 fill_value = 3;
}
