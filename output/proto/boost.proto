syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "uuid.proto";

enum RegenerationTraitBoostModifier {
  RegenerationTraitBoostModifier_MAX_CAP = 0;
  RegenerationTraitBoostModifier_DURATION = 1;
}

message BoostsDTO {
  google.protobuf.Timestamp synced_at = 1;
}

message BoostDTO {
  int32 player_id = 1;
  string boost_definition_id = 3;
  float modifier = 4;
  google.protobuf.Any source_data = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
}

message BoostDefinitionDTO {
  string id = 1;
  google.protobuf.Any boost_type = 2;
  google.protobuf.Any modifier = 3;
}

message BoostDefinitionModifierDTO {
  float modifier = 1;
}

message BoostProductionTimeComponentDTO {
  string id = 1;
  string building_definition_id = 3;
  string building_type = 4;
  string building_group = 5;
  string wonder_definition_id = 6;
}

message BoostResourceComponentDTO {
  string id = 1;
  double modifier = 2;
  string building_definition_id = 3;
  string building_type = 4;
  string building_group = 5;
  string resource_definition_id = 6;
  string resource_type = 7;
  string cities = 8;
  string dynamic_modified_float_definition_id = 9;
}

message BuildingBoostComponentDTO {
  string id = 1;
  string boost_definition_id = 2;
}

message BuildingBoostSourceDataDTO {
  UUID building_id = 1;
  string component_id = 2;
}

message WonderBoostSourceDataDTO {
  string wonder_definition_id = 1;
  string component_id = 2;
}

message DailyEconomyBoostComponentDTO {
  string id = 1;
  int32 level = 2;
  double modifier = 3;
  google.protobuf.Duration duration = 4;
}

message WonderContributionBoostDTO {
  string id = 1;
  string resource_type = 2;
  string resource_definition_id = 3;
}

message RegenerationTraitBoostDTO {
  string id = 1;
  RegenerationTraitBoostModifier modifier = 2;
  string resource_definition_id = 3;
}
