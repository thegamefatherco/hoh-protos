  google.protobuf.Timestamp registration_date = 10;
  google.protobuf.Timestamp last_login = 11;
  int32 portrait_id = 12;
  bool receives_alliance_invites = 13;
  bool is_payer = 14;
  bool finished_stories = 15;
  bool public1_on1_allowed = 16;
}

message PlayerInfoDTO {
  int64 id = 1;
  string name = 2;
  int32 portrait_id = 3;
  string age = 4;
  string locale = 5;
}

message PlayerDetailsDTO {
  int32 id = 1;
  string name = 2;
  string age = 3;
  int32 portrait_id = 4;
  int64 alliance_id = 5;
  string alliance_name = 6;
  string locale = 9;
  AllianceBannerDTO alliance_banner = 10;
  bool public1_on1_allowed = 11;
}

message PlayerSpecificDTO {
}

message PlayerInitDefinitionDTO {
