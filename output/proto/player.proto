  PlayerNameError_BLACKLISTED = 5;
}

message PlayerDTO {
  int64 id = 1;
  string username = 2;
  string display_name = 3;
  PlayerSpecificDTO unlocked_cities = 4;
  PlayerSpecificDTO player_specific = 5;
  string current_age = 6;
  int64 random_seed = 8;
