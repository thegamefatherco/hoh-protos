syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "rarity.proto";

message HarborShopDefinitionDTO {
  string id = 1;
  string type = 2;
}

message HarborShopOfferComponentDTO {
  Rarity rarity = 1;
  bool is_teaser = 2;
}

message HarborShopEventStateDTO {
  string shop_definition_id = 1;
}

message HarborShopPromotionTraitDTO {
  string shop_definition_id = 1;
}
