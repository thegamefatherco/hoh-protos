syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/any.proto";
import "reward.proto";

message DiyRewardSelectedRequest {
  string shop_offer_definition_id = 1;
}

message DiyRewardDTO {
  BaseRewardDTO base_data = 1;
  DiyPoolDefinitionDTO diy_pool_definition = 2;
  int32 selection_amount = 3;
}

message DiyPoolDefinitionDTO {
  string id = 1;
}

message DiyRewardOptionDTO {
  int32 option_id = 1;
  google.protobuf.Any reward = 2;
}
