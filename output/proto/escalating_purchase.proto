syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "google/protobuf/timestamp.proto";

message EscalatingPurchaseRequest {
  int64 event_id = 1;
  string component_id = 2;
}

message EscalatingPurchaseComponentDTO {
  string definition_id = 1;
  int32 purchase_actions = 2;
  int32 max_purchases_per_period = 3;
  string reset_cron = 4;
  bool relative_to_event_start = 5;
}

message EscalatingPurchaseStateDTO {
  int32 purchases_in_current_period = 1;
  google.protobuf.Timestamp next_reset_at = 2;
}
