syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "player.proto";

message PlayerSearchRequest {
  enum SearchMode {
    SUGGESTION_ALLIANCE_LOCALE = 0;
    SUGGESTION_ANY_LOCALES = 1;
    NICKNAME = 2;
    PLAYER_ID = 3;
    PLAYER_ID_LIST = 4;
  }
  message SearchQuery {
    int64 pagination_hero_power = 1;
    string nickname = 2;
    int32 player_id = 3;
    string pagination_nickname = 4;
  }
  SearchMode search_type = 1;
  SearchQuery query = 2;
}

message PlayerSearchResponse {
}

message PlayerSearchEntryDTO {
  PlayerDetailsDTO player = 1;
  int64 total_hero_power = 2;
  string pvp_tier = 3;
  int32 ath_difficulty = 4;
  string pvp_elite_tier = 5;
}
