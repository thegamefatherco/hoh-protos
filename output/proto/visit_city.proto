syntax = "proto3";

package InnoGames.Generated.Protobuf;

import "player.proto";
import "wonder.proto";

message OtherCityDTO {
  int64 id = 1;
  PlayerInfoDTO player_profile = 2;
  string definition_id = 3;
  string name = 4;
  ReworkedWondersDTO buildings = 5;
  ReworkedWondersDTO grid = 6;
  ReworkedWondersDTO wonders = 7;
}

message VisitCityRequest {
  int64 player_id = 1;
  string city_definition_id = 3;
}
