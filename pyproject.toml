[project]
name = "hoh-protos"
version = "0.1.0"
description = "Extract .proto schemas from Unity IL2CPP + Google.Protobuf XAPK files for Heroes of History."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "hoh-protos contributors" }]
keywords = [
  "protobuf",
  "il2cpp",
  "xapk",
  "unity",
  "reverse-engineering",
  "heroes-of-history",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = ["protobuf>=4.25", "platformdirs>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# UnityPy documents breaking changes between minor versions, hence the ceiling.
assets = ["UnityPy>=1.25.2,<1.26"]

[project.scripts]
hoh-protos = "xapk_to_proto.cli:main"

[project.urls]
Homepage = "https://github.com/thegamefatherco/hoh-protos"
Issues = "https://github.com/thegamefatherco/hoh-protos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xapk_to_proto"]

[tool.hatch.build.targets.wheel.force-include]
"src/xapk_to_proto/data/well_known.pb" = "xapk_to_proto/data/well_known.pb"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/xapk_to_proto",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
