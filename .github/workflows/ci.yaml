name: CI

on:
  push:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          log_level: debug
      - name: Setup dependencies
        run: mise task run setup
      - name: Generate protos
        run: mise task run generate
