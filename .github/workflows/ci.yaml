name: CI

on:
  push:
  pull_request:

jobs:
  generate:
    name: generate (${{ matrix.os }}, ${{ matrix.world }}/${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        world: [un0]
        version: ["1.50.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: latest
          install: true
          cache: true

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install package
        run: uv sync

      - name: Setup dependencies
        run: uv run hoh-protos setup

      - name: Restore XAPK cache
        id: xapk-cache
        uses: actions/cache@v4
        with:
          path: fixtures/${{ matrix.world }}/${{ matrix.version }}/com.innogames.heroesofhistory_${{ matrix.version }}.xapk
          key: xapk-${{ matrix.world }}-${{ matrix.version }}-v1

      - name: Download XAPK
        if: steps.xapk-cache.outputs.cache-hit != 'true'
        run: >
          uv run hoh-protos download-xapk ${{ matrix.version }}
          -o fixtures/${{ matrix.world }}/${{ matrix.version }}

      - name: Generate protos
        run: >
          uv run hoh-protos run
          fixtures/${{ matrix.world }}/${{ matrix.version }}/com.innogames.heroesofhistory_${{ matrix.version }}.xapk
          -o output/${{ matrix.world }}/${{ matrix.version }}
          --gamedesign-input fixtures/${{ matrix.world }}/${{ matrix.version }}/gamedesign
          --wire-fix-input fixtures/${{ matrix.world }}/${{ matrix.version }}/gamedesign
          --gamedesign
          -v
